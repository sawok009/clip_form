<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งคลิปการแข่งขันทักษะวิชาการและสิ่งประดิษฐ์นักเรียนโรงเรียนเอกชน จังหวัดปทุมธานี</title>
    <style>
        /* กำหนดให้หน้าเว็บหลักเต็มจอและไม่มี Scrollbar ซ้อน */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ซ่อน scrollbar ของหน้าหลัก ตัดปัญหาแถบเลื่อนซ้อน */
            background-color: #f3f4f6;
        }
        /* ปรับ iframe ให้เต็มพื้นที่หน้าจอพอดี */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
      src="https://script.google.com/macros/s/AKfycbyweMBc01QqM1Lx4NY_Zj6AOyMadqKscr1NVblV91BpGYM79B4Q-HGdZHeKkp9TyMBoMA/exec"

</html>
